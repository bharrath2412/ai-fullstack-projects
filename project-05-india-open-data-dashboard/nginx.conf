worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Immutable hashed assets from the Vite build.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # The shell must always revalidate, or users get stuck on an old build.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # The service worker is hand-written and unhashed: revalidate every time.
    location = /sw.js {
      add_header Cache-Control "no-cache";
      add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
      types { } default_type application/manifest+json;
      add_header Cache-Control "public, max-age=3600";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
