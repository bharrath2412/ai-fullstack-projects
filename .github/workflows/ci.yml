name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullstack-web:
    name: TaskFlow (React + Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            project-01-taskflow-fullstack/server/package-lock.json
            project-01-taskflow-fullstack/client/package-lock.json
      - name: Install API deps
        working-directory: project-01-taskflow-fullstack/server
        run: npm ci
      - name: Test API
        working-directory: project-01-taskflow-fullstack/server
        run: npm test
      - name: Install web deps and build
        working-directory: project-01-taskflow-fullstack/client
        run: |
          npm ci
          npm run build

  ai-agent:
    name: AgentForge (AI agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-02-agentforge-ai-agent/requirements-dev.txt
      - name: Install
        working-directory: project-02-agentforge-ai-agent
        run: pip install -r requirements-dev.txt
      - name: Seed sandbox database
        working-directory: project-02-agentforge-ai-agent
        run: python -m app.data.seed
      - name: Test
        working-directory: project-02-agentforge-ai-agent
        run: python -m pytest

  ml-service:
    name: Churn ML service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-03-churn-ml-service/requirements-dev.txt
      - name: Install
        working-directory: project-03-churn-ml-service
        run: pip install -r requirements-dev.txt
      - name: Train + register a model
        working-directory: project-03-churn-ml-service
        run: python -m churn.train --cv 3
      - name: Test
        working-directory: project-03-churn-ml-service
        run: python -m pytest

  rag:
    name: DocMind (RAG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-04-docmind-rag/requirements-dev.txt
      - name: Install
        working-directory: project-04-docmind-rag
        run: pip install -r requirements-dev.txt
      - name: Build index
        working-directory: project-04-docmind-rag
        run: python -m docmind.ingest
      - name: Test
        working-directory: project-04-docmind-rag
        run: python -m pytest
      - name: Retrieval quality gate
        working-directory: project-04-docmind-rag
        run: python -m docmind.evaluate

  airgrid-pwa:
    name: AirGrid (React PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: project-05-india-open-data-dashboard/package-lock.json
      - name: Install
        working-directory: project-05-india-open-data-dashboard
        run: npm ci
      - name: Test (unit + jsdom render)
        working-directory: project-05-india-open-data-dashboard
        run: npm test
      - name: Regenerate the snapshot and check it is byte-identical
        working-directory: project-05-india-open-data-dashboard
        run: |
          cp src/data/air-quality.json /tmp/snapshot.json
          npm run data
          diff -q /tmp/snapshot.json src/data/air-quality.json
      - name: Production build
        working-directory: project-05-india-open-data-dashboard
        run: npm run build
      - name: Gzip budget gate (fails if the bundle grows)
        working-directory: project-05-india-open-data-dashboard
        run: npm run check:budget

  billbook-saas:
    name: BillBook (FastAPI SaaS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-06-billbook-gst-saas/requirements-dev.txt
      - name: Install
        working-directory: project-06-billbook-gst-saas
        run: pip install -r requirements-dev.txt
      - name: Seed the demo shop (exercises the service layer end to end)
        working-directory: project-06-billbook-gst-saas
        run: python -m scripts.seed
      - name: Test with coverage
        working-directory: project-06-billbook-gst-saas
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: PDF smoke test against the seeded invoice
        working-directory: project-06-billbook-gst-saas
        run: |
          python - <<'PY'
          from app.config import get_settings
          from app.db import connect
          from app.pdf import render_invoice_pdf
          from app.services import get_invoice, get_tenant

          conn = connect(get_settings().db_path)
          row = conn.execute("SELECT id, tenant_id FROM invoices ORDER BY id LIMIT 1").fetchone()
          invoice = get_invoice(conn, row["tenant_id"], row["id"])
          data = render_invoice_pdf(invoice, get_tenant(conn, row["tenant_id"]))
          assert data.startswith(b"%PDF-") and len(data) > 1500, "PDF looks wrong"
          print(f"rendered {invoice['number']} -> {len(data)} bytes")
          PY
