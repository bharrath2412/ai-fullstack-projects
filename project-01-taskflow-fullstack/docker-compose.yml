services:
  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PATH: /data/taskflow.db
      JWT_SECRET: ${JWT_SECRET:-please-change-this-in-production}
      CORS_ORIGIN: http://localhost:8080
      SEED_ON_START: "true"
    volumes:
      - taskflow-data:/data
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  taskflow-data:
