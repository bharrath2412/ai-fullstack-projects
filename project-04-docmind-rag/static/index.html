<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DocMind — ask your documentation</title>
<style>
  :root{
    --bg:#070b14; --panel:#0e1524; --line:rgba(148,163,184,.16); --text:#e7eefb; --muted:#8fa1bb;
    --accent:#4ade80; --accent2:#38bdf8; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);
    background:radial-gradient(900px 520px at 8% -10%,rgba(56,189,248,.18),transparent 60%),
               radial-gradient(700px 420px at 100% 0%,rgba(74,222,128,.12),transparent 55%),var(--bg);
    display:flex;flex-direction:column;
  }
  header{display:flex;align-items:center;gap:.8rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:.8rem;
    background:linear-gradient(145deg,#4ade80,#0891b2);color:#04140d;box-shadow:0 12px 26px -14px #0891b2}
  header strong{display:block;font-size:.95rem}
  header small{color:var(--muted);font-size:.74rem}
  .badges{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
  .badge{font-size:.68rem;padding:.2rem .5rem;border-radius:999px;border:1px solid var(--line);
    background:rgba(148,163,184,.07);color:var(--muted);font-family:var(--mono)}
  main{flex:1;display:grid;grid-template-columns:1fr 360px;min-height:0}
  @media(max-width:980px){main{grid-template-columns:1fr}aside{display:none}}
  .chat{display:flex;flex-direction:column;min-height:0}
  .messages{flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
  .msg{max-width:min(760px,94%)}
  .msg.user{margin-left:auto}
  .bubble{padding:.8rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--panel);
    font-size:.9rem;line-height:1.6;white-space:pre-wrap}
  .msg.user .bubble{background:linear-gradient(180deg,#12324a,#0d2334);border-color:rgba(56,189,248,.35)}
  .bubble code{font-family:var(--mono);font-size:.83em;background:rgba(148,163,184,.14);padding:.1rem .3rem;border-radius:5px}
  .bubble pre{margin:.5rem 0;padding:.65rem;border-radius:9px;background:#050a12;border:1px solid var(--line);overflow-x:auto}
  .who{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.3rem}
  .meta{margin-top:.45rem;font-size:.7rem;color:var(--muted);font-family:var(--mono)}
  .cites{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}
  .cite{border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.09);color:#a7f3d0;
    font-size:.7rem;padding:.2rem .5rem;border-radius:999px;cursor:pointer}
  .cite:hover{background:rgba(74,222,128,.18)}
  .composer{border-top:1px solid var(--line);padding:.85rem 1.25rem 1.1rem;background:rgba(7,11,20,.7)}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
  .chip{background:rgba(148,163,184,.08);border:1px solid var(--line);color:var(--muted);font-size:.74rem;
    padding:.3rem .6rem;border-radius:999px;cursor:pointer}
  .chip:hover{color:var(--text);border-color:var(--accent2)}
  .inputrow{display:flex;gap:.6rem;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:48px;max-height:150px;padding:.7rem .85rem;border-radius:12px;
    background:#0a1120;border:1px solid var(--line);color:var(--text);font:inherit;font-size:.9rem;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,189,248,.16)}
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid transparent;padding:.72rem 1.1rem;
    font-weight:650;font-size:.86rem;color:#04140d;background:linear-gradient(180deg,#6ee7b7,#34d399);
    box-shadow:0 12px 26px -16px #10b981}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  aside{border-left:1px solid var(--line);background:rgba(9,14,26,.4);display:flex;flex-direction:column;min-height:0}
  .aside-head{padding:.85rem 1rem;border-bottom:1px solid var(--line);font-size:.72rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted)}
  .chunks{overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.55rem}
  .chunk{border:1px solid var(--line);border-radius:11px;padding:.6rem .7rem;background:rgba(14,21,36,.8)}
  .chunk h4{margin:0 0 .25rem;font-size:.78rem;color:#bae6fd}
  .chunk .score{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-bottom:.3rem}
  .chunk p{margin:0;font-size:.73rem;color:#b6c4d8;line-height:1.5;max-height:84px;overflow:hidden}
  .empty{padding:1rem;color:var(--muted);font-size:.78rem}
  .dots{display:inline-flex;gap:3px}
  .dots span{width:5px;height:5px;border-radius:50%;background:var(--accent2);animation:blink 1.1s infinite}
  .dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
</style>
</head>
<body>
<header>
  <div class="logo">DM</div>
  <div><strong>DocMind</strong><small>hybrid retrieval · citations · grounded answers</small></div>
  <div class="badges">
    <span class="badge" id="stats">index: …</span>
    <span class="badge" id="mode">…</span>
  </div>
</header>
<main>
  <section class="chat">
    <div class="messages" id="messages">
      <div class="msg assistant">
        <div class="who">DocMind</div>
        <div class="bubble">Ask a question about the indexed documentation. Every answer cites the passages it used — click a citation to inspect the retrieved chunk on the right.</div>
      </div>
    </div>
    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="inputrow">
        <textarea id="input" rows="1" placeholder="Ask your docs… (Enter to send)"></textarea>
        <button id="send">Ask</button>
      </div>
    </div>
  </section>
  <aside>
    <div class="aside-head">Retrieved context</div>
    <div class="chunks" id="chunks"><p class="empty">Retrieved passages will appear here.</p></div>
  </aside>
</main>
<script>
(() => {
  const messagesEl = document.getElementById('messages');
  const chunksEl = document.getElementById('chunks');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statsEl = document.getElementById('stats');
  const modeEl = document.getElementById('mode');
  const chipsEl = document.getElementById('chips');
  let busy = false;

  const SUGGESTIONS = [
    'How long does an API access token stay valid?',
    'What should I do when I receive a 429?',
    'Which plans include single sign-on?',
    'What is the on-call escalation path for a Sev-1?',
    'What chunk size does ingestion use?',
    'How do I rotate a leaked API key?',
  ];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = (text) => esc(text)
      .replace(/```([\s\S]*?)```/g, (_, c) => `<pre>${c.trim()}</pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[(\d+)\]/g, '<sup>[$1]</sup>');

  SUGGESTIONS.forEach((q) => {
    const chip = document.createElement('button');
    chip.className = 'chip'; chip.textContent = q;
    chip.onclick = () => { inputEl.value = q; submit(); };
    chipsEl.appendChild(chip);
  });

  function bubble(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `<div class="who">${role === 'user' ? 'You' : 'DocMind'}</div>
      <div class="bubble">${fmt(text)}</div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function renderChunks(citations) {
    if (!citations?.length) {
      chunksEl.innerHTML = '<p class="empty">No passages retrieved.</p>';
      return;
    }
    chunksEl.innerHTML = citations.map((c) => `
      <div class="chunk" id="cite-${c.index}">
        <h4>[${c.index}] ${esc(c.title)}</h4>
        <div class="score">score ${c.score} · ${esc(c.source)}</div>
        <p>${esc(c.snippet)}</p>
      </div>`).join('');
  }

  async function submit() {
    const question = inputEl.value.trim();
    if (!question || busy) return;
    busy = true; sendBtn.disabled = true;
    inputEl.value = ''; inputEl.style.height = 'auto';

    bubble('user', question);
    const answerWrap = bubble('assistant', '');
    const answerBubble = answerWrap.querySelector('.bubble');
    answerBubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

    let streamed = '';
    let citations = [];

    try {
      const response = await fetch('/query/stream', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split('\n\n');
        buffer = frames.pop() ?? '';
        for (const frame of frames) {
          const name = frame.match(/^event: (.+)$/m)?.[1]?.trim();
          const raw = frame.match(/^data: (.+)$/m)?.[1];
          if (!name || !raw) continue;
          let data = {};
          try { data = JSON.parse(raw); } catch { /* ignore */ }

          if (name === 'retrieved') {
            citations = data.citations || [];
            renderChunks(citations);
          } else if (name === 'token') {
            streamed += data.text || '';
            answerBubble.innerHTML = fmt(streamed);
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } else if (name === 'done') {
            answerBubble.innerHTML = fmt(data.answer || streamed);
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `${data.timings?.total_ms ?? '?'}ms · retrieval ${data.timings?.retrieval_ms ?? '?'}ms · grounded=${data.grounded}`;
            answerWrap.appendChild(meta);
            const citeRow = document.createElement('div');
            citeRow.className = 'cites';
            citeRow.innerHTML = citations.map((c) =>
              `<span class="cite" data-index="${c.index}">[${c.index}] ${esc(c.source)}</span>`).join('');
            citeRow.querySelectorAll('.cite').forEach((el) => {
              el.onclick = () => {
                const target = document.getElementById(`cite-${el.dataset.index}`);
                target?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                if (target) { target.style.borderColor = '#4ade80'; setTimeout(() => target.style.borderColor = '', 1200); }
              };
            });
            answerWrap.appendChild(citeRow);
          } else if (name === 'error') {
            answerBubble.innerHTML = fmt(`Error: ${data.message}`);
          }
        }
      }
    } catch (err) {
      answerBubble.innerHTML = fmt(`Something went wrong: ${err.message}`);
    } finally {
      busy = false; sendBtn.disabled = false;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  sendBtn.onclick = submit;
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
  });

  fetch('/stats').then((r) => r.json()).then((data) => {
    statsEl.textContent = `index: ${data.store.chunks} chunks / ${data.store.documents} docs`;
    modeEl.textContent = `${data.embedding} · ${data.generator}`;
  }).catch(() => { statsEl.textContent = 'index: unavailable'; });
})();
</script>
</body>
</html>
